<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2410"/>
      <stop offset="0.32" stop-color="#8a5a22"/>
      <stop offset="0.58" stop-color="#d8913c"/>
      <stop offset="0.78" stop-color="#f0c46a"/>
      <stop offset="1" stop-color="#6b4a1f"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.98"/>
      <stop offset="0.35" stop-color="#ffd982" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#e89339" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d99a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#f6d99a" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#2c2513" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2414"/>
      <stop offset="1" stop-color="#080d08"/>
    </linearGradient>
    <linearGradient id="arbol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b120b"/>
      <stop offset="0.5" stop-color="#18200f"/>
      <stop offset="1" stop-color="#070c07"/>
    </linearGradient>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="bruma" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Cielo y resplandor -->
  <rect width="1600" height="900" fill="url(#cielo)"/>
  <ellipse cx="1080" cy="430" rx="360" ry="300" fill="url(#sol)"/>
  <circle cx="1080" cy="430" r="92" fill="#ffe6a3" opacity="0.92"/>
  <circle cx="1080" cy="430" r="128" fill="#ffd177" opacity="0.22" filter="url(#suave)"/>

  <!-- Nubes alargadas -->
  <g fill="#f4c878" opacity="0.22" filter="url(#bruma)">
    <ellipse cx="420" cy="268" rx="310" ry="26"/>
    <ellipse cx="1180" cy="220" rx="360" ry="20"/>
    <ellipse cx="880" cy="330" rx="420" ry="16"/>
    <ellipse cx="240" cy="390" rx="260" ry="14"/>
  </g>

  <!-- Colinas lejanas -->
  <path d="M0 566 C220 500 360 548 560 508 C760 468 900 530 1090 492 C1280 454 1440 510 1600 472 L1600 900 L0 900 Z" fill="#55401f" opacity="0.55"/>
  <path d="M0 630 C230 570 420 620 620 578 C830 534 1030 600 1240 558 C1400 526 1500 560 1600 540 L1600 900 L0 900 Z" fill="#2e2a17" opacity="0.78"/>

  <!-- Bruma horizontal -->
  <rect x="0" y="470" width="1600" height="250" fill="url(#niebla)"/>

  <!-- Troncos del fondo -->
  <g fill="url(#arbol)" opacity="0.55">
    <rect x="120" y="120" width="26" height="640"/>
    <rect x="330" y="70" width="34" height="700"/>
    <rect x="580" y="150" width="22" height="620"/>
    <rect x="820" y="90" width="30" height="670"/>
    <rect x="1260" y="110" width="36" height="660"/>
    <rect x="1480" y="60" width="30" height="720"/>
  </g>

  <!-- Árboles principales -->
  <g fill="url(#arbol)">
    <path d="M40 900 L40 120 Q52 70 64 120 L64 900 Z"/>
    <path d="M-40 300 Q50 250 150 286 Q80 320 -40 340 Z"/>
    <path d="M-30 470 Q70 420 170 458 Q90 492 -30 512 Z"/>

    <path d="M252 900 L252 40 Q268 -10 284 40 L284 900 Z"/>
    <path d="M150 210 Q268 150 386 200 Q290 246 150 260 Z"/>
    <path d="M170 390 Q268 330 370 380 Q280 430 170 444 Z"/>
    <path d="M120 620 Q268 560 420 612 Q290 660 120 676 Z"/>

    <path d="M520 900 L520 170 Q534 126 548 170 L548 900 Z"/>
    <path d="M430 320 Q534 270 640 312 Q560 352 430 366 Z"/>

    <path d="M1370 900 L1370 20 Q1388 -34 1406 20 L1406 900 Z"/>
    <path d="M1260 220 Q1388 160 1510 214 Q1410 262 1260 278 Z"/>
    <path d="M1240 430 Q1388 372 1536 424 Q1410 474 1240 492 Z"/>

    <path d="M1540 900 L1540 110 Q1556 62 1572 110 L1572 900 Z"/>
    <path d="M1460 300 Q1556 250 1650 296 Q1570 340 1460 356 Z"/>
  </g>

  <!-- Ramas delgadas -->
  <g stroke="#0a1009" stroke-width="8" stroke-linecap="round" opacity="0.86">
    <path d="M268 230 Q360 210 430 250" fill="none"/>
    <path d="M268 430 Q350 410 410 446" fill="none"/>
    <path d="M1388 300 Q1300 280 1230 320" fill="none"/>
    <path d="M1388 500 Q1290 480 1210 520" fill="none"/>
  </g>

  <!-- Suelo y sombras -->
  <path d="M0 760 Q400 720 800 760 T1600 748 L1600 900 L0 900 Z" fill="url(#suelo)"/>
  <g fill="#050905" opacity="0.7">
    <ellipse cx="250" cy="830" rx="260" ry="40"/>
    <ellipse cx="1380" cy="840" rx="300" ry="44"/>
  </g>

  <!-- Viñeta final -->
  <rect width="1600" height="900" fill="none" stroke="#020402" stroke-width="90" opacity="0.55"/>
</svg>
